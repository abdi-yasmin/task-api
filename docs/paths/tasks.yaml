/tasks:
  get:
    tags:
      - tasks
    summary: List all tasks
    parameters:
      - name: completed
        in: query
        required: false
        description: Filter tasks by completion status
        schema:
          type: boolean
          example: true
      - name: limit
        in: query
        required: false
        description: Maximum number of tasks to return
        schema:
          type: integer
          example: 10
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas/Task.yaml
      "400":
        $ref: ../components/responses/BadRequest.yaml

  post:
    tags:
      - tasks
    summary: Create a new task
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Task.yaml
    responses:
      "201":
        description: Task created successfully
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Task.yaml
      "400":
        $ref: ../components/responses/BadRequest.yaml

/tasks/{id}:
  get:
    tags:
      - tasks
    summary: Get a single task by ID
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the task to retrieve
        schema:
          type: integer
          example: 1
    responses:
      "200":
        description: Task retrieved successfully
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Task.yaml
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ValidationError.yaml
      "404":
        description: Task not found
        content:
          application/json:
            schema:
              $ref: ../components/responses/NotFoundError.yaml
